spring:
  application:
    name: payment-gateway-app
  datasource:
    url: jdbc:postgresql://localhost:5433/payment_gateway
    username: gateway
    password: gateway
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

bank:
  base-url: http://localhost:8787
  connect-timeout: 3s
  read-timeout: 5s

resilience4j:
  retry:
    instances:
      bank-api:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.etoro.payment_gateway_app.exceptions.BankTransientException
        ignore-exceptions:
          - com.etoro.payment_gateway_app.exceptions.BankRejectedException

logging:
  level:
    com.zaxxer.hikari: DEBUG